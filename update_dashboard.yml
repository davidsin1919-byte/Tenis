name: Auto-Update Tennis Dashboard

on:
  schedule:
    # GitHub Action mínimo es cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Motor de Predicciones
        run: |
          python generate_100_real_dashboard.py

      - name: Guardar y Publicar en GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html
          # Solo hacer commit si hay cambios reales en los partidos
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated dashboard update"
          git push
