    function renderMatches(matches) {
        const tbody = document.getElementById('matches-body');
        tbody.innerHTML = '';
        
        matches.forEach(m => {
            let isFavA = m.model_prob_a > m.model_prob_b;
            
            let colorA = isFavA ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-[var(--muted-foreground)]';
            let colorB = !isFavA ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-[var(--muted-foreground)]';
            
            let winnerName = isFavA ? m.player_a : m.player_b;
            let winnerProb = isFavA ? m.model_prob_a : m.model_prob_b;
            let winnerBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">
                                👑 ${winnerName} (${(winnerProb*100).toFixed(1)}%)
                               </span>`;

            let row = `
                <tr class="hover:bg-[var(--secondary)] transition-colors">
                    <td class="p-3">
                        <div class="font-semibold text-[var(--foreground)]">${m.tournament}</div>
                        <div class="text-xs text-[var(--muted-foreground)]">${m.surface} | ${m.time}</div>
                    </td>
                    <td class="p-3">
                        <div class="flex items-center"><span class="${isFavA ? 'font-bold' : 'font-medium'}">${m.player_a}</span></div>
                        <div class="flex items-center mt-1"><span class="${!isFavA ? 'font-bold' : 'font-medium'}">${m.player_b}</span></div>
                    </td>
                    <td class="p-3 font-mono text-xs">
                        <div class="text-[var(--muted-foreground)]">Elo Gen: ${m.elo_a_gen} | Surf: ${m.elo_a_surf}</div>
                        <div class="mt-1 text-[var(--muted-foreground)]">Elo Gen: ${m.elo_b_gen} | Surf: ${m.elo_b_surf}</div>
                    </td>
                    <td class="p-3 font-mono">
                        <div class="${colorA} text-lg">${(m.model_prob_a * 100).toFixed(1)}%</div>
                        <div class="mt-1 ${colorB} text-lg">${(m.model_prob_b * 100).toFixed(1)}%</div>
                    </td>
                    <td class="p-3">
                        ${winnerBadge}
                    </td>
                </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', row);
        });
    }

    function filterMatches(type) {
        if (type === 'high-prob') {
            const clearFavorites = allMatches.filter(m => m.model_prob_a > 0.65 || m.model_prob_b > 0.65);
            renderMatches(clearFavorites.sort((a,b) => Math.max(b.model_prob_a, b.model_prob_b) - Math.max(a.model_prob_a, a.model_prob_b)));
        } else {
            renderMatches(allMatches);
        }
    }
  </script>
</body>
</html>
